name: Fast Clang Metal LLVM IR CI

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build-and-test-metal:
    runs-on: macos-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 1

      - name: Setup Cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cache/ccache
            build
          key: ${{ runner.os }}-clang-metal-ccache-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-clang-metal-ccache-

      - name: Install dependencies
        run: |
          brew install ccache ninja

      - name: Start SSH Session
        uses: owenthereal/action-upterm@v1
        if: always()
        with:
          wait-timeout-minutes: 360
