# Windows CE LLVM/Clang/LLD cross toolchain — CI
#
# Two modes:
#   * default (push to llvm-wince, or a plain workflow_dispatch): the FAST
#     gate — one free 4-vCPU/16GB runner, ccache + Ninja build-dir caching,
#     mold as the linker, and only the minimal tool set built.  It runs the
#     WinCE lit tests (the thing that has never been executed).  This is the
#     hot feedback loop: edit, push, watch lit.
#   * workflow_dispatch with `run_full: true`: followed by the full Stage 2
#     (sysroot) + Stage 3 (runtimes) + packaging, on the same cached build.
#
# Caching is what makes the hot loop fast: ccache and the Ninja build/
# directory are restored by key and resumed incrementally, so a small fix
# after a prior run only recompiles what changed (and links with mold).
#
# Note on `concurrency.cancel-in-progress`: repeated pushes cancel the
# in-flight run for the same ref so the latest code always wins.  This is
# exactly what we want for live fix/push/observe; the cache from the
# cancelled run is still saved.

name: wince-llvm-toolchain

on:
  push:
    branches: [llvm-wince]
  workflow_dispatch:
    inputs:
      ce_target:
        description: "WinCE target triple (arm-pc-wince only is supported)"
        default: "arm-pc-wince"
        type: choice
        options: [arm-pc-wince]
      run_full:
        description: "Also run Stage 2 sysroot + Stage 3 runtimes + package"
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: wince-llvm-${{ github.ref }}
  cancel-in-progress: true

env:
  TARGET: ${{ inputs.ce_target || 'arm-pc-wince' }}
  # ccache inside the workspace so actions/cache can persist it.  It is a
  # content-addressable store, so a big cache survives many pushes.
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_MAXSIZE: 2G
  CCACHE_COMPRESS: "1"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_NOHASHDIR: "true"

jobs:
  build:
    name: WinCE toolchain
    runs-on: ubuntu-24.04   # free GitHub-hosted, 4 vCPU / 16 GB
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build cmake python3 python3-psutil zlib1g-dev gcc g++ make \
            lld ccache zstd mold
          # WinCE.cmake asks for LLVM_USE_LINKER=mold; CMake then probes the
          # host compiler with -fuse-ld=mold, which needs ld.mold on PATH.
          if ! command -v ld.mold >/dev/null 2>&1; then
            sudo ln -sf "$(command -v mold)" /usr/local/bin/ld.mold
          fi
          echo "mold: $(mold --version)"
          echo "ccache: $(ccache --version | head -1)"
          echo "ninja: $(ninja --version)"
          echo "nproc=$(nproc)  mem=$(free -h | awk '/Mem/{print $2}')"

      # -----------------------------------------------------------------
      # Caching (the speedup).  Keyed on the stable WinCE cache/config so a
      # source fix after a prior run restores the same cache and only
      # recompiles what changed.  restore-keys fall back to the last cache.
      # -----------------------------------------------------------------
      # Restore ccache and the Ninja build tree.  Keys are keyed on github.sha
      # so every run saves a fresh entry; restore-keys recovers the most recent
      # prefix match, which is what makes a small source fix resume
      # incrementally instead of rebuilding clang/lld from scratch.
      - name: Restore ccache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}
          restore-keys: ccache-${{ runner.os }}-

      - name: Restore Ninja build dir
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/build
          key: ninja-${{ runner.os }}-${{ hashFiles('clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}
          restore-keys: ninja-${{ runner.os }}-

      # -----------------------------------------------------------------
      # Stage 1: host LLVM/Clang/LLD + the binary tools the lit tests need
      # -----------------------------------------------------------------
      - name: "Stage 1: configure (WinCE cache)"
        # Re-running cmake on a restored build/ dir is a fast no-op
        # reconfigure; it never reconfigures from scratch on a cache hit.
        run: |
          ccache -z
          cmake -G Ninja -S llvm -B build \
            -C clang/cmake/caches/WinCE.cmake \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX="$PWD/install/wince-llvm" \
            -DLLVM_INSTALL_TOOLCHAIN_ONLY=ON
          echo "ccache stats before build:"
          ccache -s

      - name: "Stage 1: build clang + lld + tools"
        run: |
          cmake --build build --target clang lld llc \
            llvm-ar llvm-ranlib llvm-dlltool llvm-nm llvm-mc llvm-readobj \
            llvm-objdump llvm-config FileCheck split-file not count
          BIN=build/bin
          [ -e "$BIN/clang-cl" ] || ln -sf clang "$BIN/clang-cl"
          [ -e "$BIN/lld-link" ] || ln -sf lld "$BIN/lld-link"
          test -x "$BIN/llvm-lit"
          echo "ccache stats after build:"
          ccache -s

      # Save immediately after the build so the (possibly partial) build tree
      # and ccache persist even when the build or the lit gate below fails.
      # `if: always()` is what keeps the fix/push/observe loop incremental.
      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/.ccache
          key: ccache-${{ runner.os }}-${{ hashFiles('clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}

      - name: Save Ninja build dir
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/build
          key: ninja-${{ runner.os }}-${{ hashFiles('clang/cmake/caches/WinCE.cmake') }}-${{ github.sha }}

      - name: "Stage 1: WinCE lit tests (fast gate)"
        # The always-run gate.  On failure the log tail is echoed so a
        # fix/push/observe loop sees exactly what broke.  Only the WinCE
        # test files are listed (running full clang/lld/llvm suites would
        # be slow and is out of scope for the toolchain).
        run: |
          set +e
          ./build/bin/llvm-lit -sv --timeout 900 \
            clang/test/Driver/wince.c \
            clang/test/CodeGen/wince-seh.c \
            clang/test/CodeGen/ARM/wince-ehabi-tables.c \
            clang/test/CodeGen/ARM/wince-global-ctors.c \
            clang/test/CodeGen/ARM/wince-literal-pool.c \
            clang/test/CodeGen/ARM/wince-seh-ehabi-mixed.c \
            clang/test/CodeGen/ARM/wince-seh-scope-table.c \
            clang/test/Parser/ms-pragmas-full.c \
            clang/test/Parser/ms-extern.c \
            clang/test/Sema/ms-extern.c \
            lld/test/COFF/wince-arm-relocs.s \
            lld/test/COFF/wince-ctors.s \
            lld/test/COFF/wince-exidx-bounds.s \
            lld/test/COFF/wince-image.s \
            lld/test/COFF/wince-pdata.test \
            lld/test/COFF/wince-range-thunk.s \
            lld/test/COFF/wince-thumb-bit.s \
            lld/test/COFF/wince-thunk.s \
            llvm/test/MC/ARM/wince-coff-relocs.s \
            llvm/test/MC/ARM/wince-exidx.s \
            llvm/test/MC/ARM/wince-seh-pdata.s \
            llvm/test/MC/ARM/wince-armasm.s \
            llvm/test/MC/ARM/wince-armasm-labels.s \
            llvm/test/CodeGen/ARM/wince-seh-parent-frame.ll \
            llvm/test/CodeGen/ARM/wince-soft-float.ll
          RC=$?
          set -e
          if [ $RC -ne 0 ]; then
            echo "===== WinCE lit gate FAILED (rc=$RC) ====="
            exit $RC
          fi

      # cmake --install walks every tool's cmake_install.cmake, including
      # llvm-profdata which Stage 1 does not build (CI 33346086826).
      # Install only the ninja targets this cache actually produces.
      - name: "Install (isolated prefix)"
        if: ${{ inputs.run_full }}
        run: |
          cmake --build build --target \
            install-clang install-clang-resource-headers \
            install-lld \
            install-llvm-ar install-llvm-ranlib install-llvm-dlltool \
            install-llvm-nm install-llvm-mc install-llvm-readobj \
            install-llvm-objdump install-llvm-config
          BIN="$PWD/install/wince-llvm/bin"
          [ -e "$BIN/clang++" ] || ln -sf clang "$BIN/clang++"
          [ -e "$BIN/clang-cl" ] || ln -sf clang "$BIN/clang-cl"
          [ -e "$BIN/lld-link" ] || ln -sf lld "$BIN/lld-link"
          ls -l "$BIN"

      # -----------------------------------------------------------------
      # Full pipeline: only when explicitly requested.  Runs on the same
      # cached build, so it is cheap after the gate above passes.
      # -----------------------------------------------------------------
      - name: "Stage 2: assemble sysroot"
        if: ${{ inputs.run_full }}
        run: |
          utils/wince/build-wince-sysroot.sh \
            --toolchain "$PWD/install/wince-llvm/bin" \
            --target "$TARGET" \
            --prefix "$PWD/install/wince-llvm/wince-sysroot" \
            --jobs "$(nproc)"

      - name: "Stage 2: smoke-check"
        if: ${{ inputs.run_full }}
        run: |
          CLANG="$PWD/install/wince-llvm/bin/clang"
          printf 'int __attribute__((constructor)) c(void){return 0;}\nint main(void){return 0;}\n' > smoke.c
          "$CLANG" --target="$TARGET" -c smoke.c -o smoke.o
          "$CLANG" --target="$TARGET" -### smoke.c -o smoke.exe 2>&1 | head -20

      - name: "Stage 3: runtimes"
        if: ${{ inputs.run_full }}
        run: |
          utils/wince/build-wince-runtimes.sh \
            --toolchain "$PWD/install/wince-llvm/bin" \
            --sysroot "$PWD/install/wince-llvm/wince-sysroot" \
            --target "$TARGET" \
            --build-dir "$PWD/build-wince-runtimes"

      - name: "Package (isolated install + target-prefixed wrappers)"
        if: ${{ inputs.run_full }}
        run: |
          PREFIX="$PWD/install/wince-llvm"
          BIN="$PREFIX/bin"
          for t in clang clang++ gcc g++ cc c++ ld.lld; do
            if [ -e "$BIN/$t" ] || [ -L "$BIN/$t" ]; then
              ln -sf "$t" "$BIN/arm-pc-wince-$t"
            fi
          done
          for t in lld-link llvm-ar llvm-ranlib llvm-dlltool llvm-nm \
                   llvm-mc llvm-readobj llvm-objdump; do
            [ -e "$BIN/$t" ] && ln -sf "$t" "$BIN/arm-pc-wince-$t"
          done
          TAR="wince-llvm-$TARGET-${{ runner.os }}-${{ github.sha }}.tar.zst"
          tar --zstd -cf "$TAR" -C install wince-llvm
          sha256sum "$TAR" > "$TAR.sha256"

      - name: "Package sanity: install to /opt and compile"
        if: ${{ inputs.run_full }}
        run: |
          TAR=$(ls wince-llvm-*.tar.zst | head -1)
          sudo tar --zstd -xf "$TAR" -C /opt
          "$PWD/install/wince-llvm/bin/clang" --target="$TARGET" \
            -### -o /tmp/hi.exe /dev/null 2>&1 | head -5

      - name: Upload toolchain artifact
        if: ${{ inputs.run_full }}
        uses: actions/upload-artifact@v4
        with:
          name: wince-llvm-${{ inputs.ce_target || 'arm-pc-wince' }}-${{ runner.os }}
          path: |
            wince-llvm-*.tar.zst
            wince-llvm-*.tar.zst.sha256
          retention-days: 14
          if-no-files-found: error

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wince-llvm-logs-${{ runner.os }}
          path: |
            build-wince-sysroot/**/*.log
            build-wince-runtimes/**/*.log
          if-no-files-found: ignore
          retention-days: 14
