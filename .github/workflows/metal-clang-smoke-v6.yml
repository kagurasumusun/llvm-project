name: Metal Clang Smoke Fast

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and build"
        required: true
        default: "metal-test"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      ninja_jobs:
        description: "Parallel ninja jobs; 0 means nproc"
        required: true
        default: "0"

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "4G"
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

concurrency:
  group: metal-clang-smoke-fast-${{ inputs.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  clang-metal-smoke-fast:
    name: fast clang-only build + Metal smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout selected ref sparse
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            clang
            llvm
            cmake
            third-party

      - name: Install dependencies and choose fast host tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 ccache lld
          if ! command -v clang >/dev/null 2>&1 || ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get install -y clang
          fi
          cmake --version
          ninja --version
          ccache --version
          clang --version
          clang++ --version
          ld.lld --version
          python3 --version

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-metal-fast-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'clang/include/clang/Basic/Attr.td', 'clang/include/clang/Basic/Metal*.def', 'clang/lib/Sema/SemaDeclAttr.cpp', 'clang/lib/CodeGen/CodeGenFunction.cpp', 'clang/lib/Frontend/InitPreprocessor.cpp') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-metal-fast-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'clang/include/clang/Basic/Attr.td', 'clang/include/clang/Basic/Metal*.def', 'clang/lib/Sema/SemaDeclAttr.cpp', 'clang/lib/CodeGen/CodeGenFunction.cpp', 'clang/lib/Frontend/InitPreprocessor.cpp') }}-
            ${{ runner.os }}-metal-fast-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-
            ${{ runner.os }}-metal-fast-ccache-${{ inputs.build_type }}-
            ${{ runner.os }}-metal-fast-ccache-
            ${{ runner.os }}-metal-clang-ccache-

      - name: Configure minimal clang-only LLVM build
        run: |
          set -euxo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE" || true
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      - name: Build clang
        run: |
          set -o pipefail
          ccache --zero-stats || true
          JOBS="${{ inputs.ninja_jobs }}"
          if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          echo "Using ninja jobs: $JOBS"
          ninja -C build -j"$JOBS" clang 2>&1 | tee build.log

      - name: Save ccache immediately after build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: CCache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Run focused Metal smoke tests
        run: |
          exec > >(tee metal-smoke.log) 2>&1
          set -euxo pipefail
          CLANG="$PWD/build/bin/clang"

          run_syntax() {
            "$CLANG" -cc1 -triple "$1" -x metal -std="$2" -fsyntax-only "$3"
          }

          run_verify() {
            "$CLANG" -cc1 -triple "$1" -x metal -std="$2" -fsyntax-only -verify "$3"
          }

          run_codegen_grep() {
            local triple="$1"; shift
            local std="$1"; shift
            local file="$1"; shift
            local out="/tmp/$(basename "$file").ll"
            "$CLANG" -cc1 -triple "$triple" -x metal -std="$std" -emit-llvm -o - "$file" | tee "$out" >/dev/null
            for needle in "$@"; do
              grep -F "$needle" "$out" >/dev/null
            done
          }

          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Frontend/metal-input-kind.c
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-basic-keywords.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-prelude-types.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-generated-prelude-table.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-ast-reference-builtins.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-builtin-object-aliases.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-ast-reference-attrs.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-stdlib-builtin-decls.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-texture-methods.metal

          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-color-validation.metal
          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-builtin-input-validation.metal
          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-resource-validation.metal
          run_verify air64-apple-macosx10.14 macos-metal1.1 clang/test/Sema/metal-availability.metal
          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-mesh-raytracing-attrs.metal

          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-metadata.metal "!air.kernel" "!air.version" "!air.language_version"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-stage-metadata.metal "!air.vertex" "!air.fragment" "air.vertex_input" "air.fragment_input"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-io-metadata.metal "!air.vertex" "!air.fragment" "air.render_target" "air.depth"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-stage-in-struct.metal "air.vertex_input" "air.location_index" "user(shade_id)"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-builtin-inputs.metal "air.vertex_id" "air.front_facing" "air.threadgroup_position_in_grid"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-buffer-reference.metal "air.buffer" "air.arg_type_size"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-air-function-constants.metal "!air.function_constants" "fc_bool" "fc_int"
          run_codegen_grep air64_v22-apple-macosx10.15 metal4.0 clang/test/CodeGen/metal-air-generated-type-table.metal "generated(5colorDv4_f)" "generated(6hcolorDv4_Dh)"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-stdlib-builtin-calls.metal "@__metal_abs"
          run_codegen_grep air64_v22-apple-macosx10.15 macos-metal2.0 clang/test/CodeGen/metal-texture-methods.metal "get_width" "air.texture"
          run_codegen_grep air64_v30-apple-macosx15.0 metal3.0 clang/test/CodeGen/metal-air-mesh-raytracing-attrs.metal "air.local_index" "air.mesh" "air.payload" "air.visible"

      - name: Collect failure hints
        if: always()
        run: |
          {
            echo "# Metal Clang Smoke Fast"
            echo
            echo "- Ref: ${{ inputs.ref }}"
            echo "- Build type: ${{ inputs.build_type }}"
            echo "- Ninja jobs: ${{ inputs.ninja_jobs }}"
            echo
            echo "## Error / warning highlights"
            echo '```'
            grep -HnE "error:|warning:|FAILED|ninja: build stopped|undefined reference|No such file|Assertion|CMake Error" build.log metal-smoke.log 2>/dev/null | tail -n 250 || true
            echo '```'
            echo
            echo "## ccache stats"
            echo '```'
            ccache --show-stats 2>/dev/null || true
            echo '```'
          } | tee failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-clang-smoke-fast-logs
          path: |
            build.log
            metal-smoke.log
            failure-summary.md
          if-no-files-found: ignore
