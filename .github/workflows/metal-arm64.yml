name: Metal Two-Stage Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and build"
        required: true
        default: "metal-test"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      ninja_jobs:
        description: "Parallel ninja jobs; 0 means nproc"
        required: true
        default: "0"
      ios_target:
        description: "iOS target version"
        required: true
        default: "26.2"
        type: string
      xcode_version:
        description: "Xcode version"
        required: true
        default: "26.5"
        type: string

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "8G"
  CCACHE_NOHASHDIR: "true"
  # depend_mode uses the compiler-emitted .d file instead of preprocessing
  # the source to compute the ccache hash.  With Metal's TableGen churn on
  # Attr.td / TokenKinds.def this dramatically reduces preprocessor-time
  # miss cost.
  CCACHE_DEPEND: "true"
  # inode_cache avoids re-stat'ing every include chain for every object.
  # Requires ccache >= 4.7 (ubuntu-24.04-arm ships 4.9.1).
  CCACHE_INODECACHE: "true"
  # Store cache entries as hardlinks; there is no external consumer of the
  # cache files after a run so the "hardlink safety" caveat does not apply.
  CCACHE_HARDLINK: "true"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime,system_headers"

concurrency:
  group: metal-two-stage-arm64-${{ inputs.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  # Stage 1: Build metallib on Linux
  build-metallib:
    name: Build metallib (Linux)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 150

    steps:
      - name: Checkout selected ref sparse
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            clang
            llvm
            cmake
            third-party

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 ccache lld mold
          if ! command -v clang >/dev/null 2>&1 || ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get install -y clang
          fi
          cmake --version
          ninja --version
          ccache --version
          clang --version
          clang++ --version
          ld.lld --version
          python3 --version

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-arm64-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'cmake/**/*.cmake') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-arm64-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'cmake/**/*.cmake') }}-
            ${{ runner.os }}-arm64-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-
            ${{ runner.os }}-arm64-metal-metallib-${{ inputs.build_type }}-
            ${{ runner.os }}-arm64-metal-metallib-

      - name: Fetch Apple Metal stdlib headers from metal-info
        env:
          GITHUB_TOKEN: ${{ secrets.METAL_INFO_TOKEN }}
        run: |
          set -euxo pipefail
          # Fetch only headers (no runtime library needed - Xcode will link Metal.framework automatically)
          python3 clang/utils/metal/fetch-metal-info-resource.py \
            --output "$PWD/metal-info-resource"
          test -f "$PWD/metal-info-resource/clang/32023.883/include/metal/metal_stdlib"
          python3 clang/utils/metal/gen-metal-observed-manifest.py \
            --headers "$PWD/metal-info-resource/clang/32023.883/include/metal" \
            --output "$PWD/metal-observed-manifest.json" \
            --apple-clang-version 32023.883
          echo "✓ Apple Metal stdlib headers and compatibility manifest fetched"

      - name: Configure minimal clang-only LLVM build
        run: |
          set -euxo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE" || true
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD="AArch64" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DLLVM_USE_LINKER=mold \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_ENABLE_ASSERTIONS=$([ "${{ inputs.build_type }}" != "Release" ] && echo ON || echo OFF) \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_HLSL=OFF \
            -DLLVM_INCLUDE_UTILS=OFF \
            -DLLVM_APPEND_VC_REV=OFF \
            -DLLVM_BUILD_32_BITS=OFF \
            -DLLVM_LINK_LLVM_DYLIB=OFF \
            -DBUILD_SHARED_LIBS=OFF \
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=OFF \
            $( [ "${{ inputs.build_type }}" != "Release" ] && printf %s "-DLLVM_USE_SPLIT_DWARF=ON" )

      - name: Build clang with Metal support
        run: |
          set -o pipefail
          ccache --zero-stats || true
          # Snapshot cache state so the diff after the build is
          # attributable in the raw log.
          echo "::group::ccache config + pre-build stats"
          ccache --show-config | head -40 || true
          ccache -s || true
          echo "::endgroup::"
          JOBS="${{ inputs.ninja_jobs }}"
          if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          echo "Using ninja jobs: $JOBS"
          ninja -C build -j"$JOBS" clang metal-as metal-ld 2>&1 | tee build.log
          echo "::group::ccache post-build stats"
          ccache -s || true
          echo "::endgroup::"

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Compile Apple Metal samples to metallib
        run: |
          # Keep every frontend invocation and diagnostic as a CI artifact.
          # Do not hide a compiler failure: its exit status remains the step result.
          set -euxo pipefail
          mkdir -p test-results
          exec > >(tee test-results/metallib-smoke.log) 2>&1
          CLANG="$PWD/build/bin/clang"
          METAL_AS="$PWD/build/bin/metal-as"
          METAL_LD="$PWD/build/bin/metal-ld"
          APPLE_METAL_RESOURCE="$PWD/metal-info-resource/clang/32023.883"
          APPLE_METAL_INCLUDE="$APPLE_METAL_RESOURCE/include/metal"
          
          mkdir -p metallib-output
          
          # Compile add.metal (compute shader from Apple official sample)
          echo "Compiling add.metal..."
          "$CLANG" -cc1 -triple air64-apple-ios${{ inputs.ios_target }} -x metal -std=metal3.0 \
            -I "$APPLE_METAL_INCLUDE" \
            -include "$APPLE_METAL_INCLUDE/metal_types" \
            -emit-llvm-bc -o /tmp/add.bc \
            clang/test/AppleMetalSamples/PerformingCalculationsOnAGPU/add.metal
          
          "$METAL_AS" /tmp/add.bc -o /tmp/add.air --triple air64-apple-ios${{ inputs.ios_target }}
          
          # Compile AAPLShaders.metal (render pipeline from Apple official sample)
          echo "Compiling AAPLShaders.metal..."
          "$CLANG" -cc1 -triple air64-apple-ios${{ inputs.ios_target }} -x metal -std=metal3.0 \
            -I "$APPLE_METAL_INCLUDE" \
            -include "$APPLE_METAL_INCLUDE/metal_types" \
            -I clang/test/AppleMetalSamples/UsingARenderPipelineToRenderPrimitives \
            -emit-llvm-bc -o /tmp/AAPLShaders.bc \
            clang/test/AppleMetalSamples/UsingARenderPipelineToRenderPrimitives/AAPLShaders.metal
          
          "$METAL_AS" /tmp/AAPLShaders.bc -o /tmp/AAPLShaders.air --triple air64-apple-ios${{ inputs.ios_target }}
          
          # Link into metallib (no runtime library needed - Xcode will link Metal.framework automatically)
          echo "Linking metallib..."
          "$METAL_LD" /tmp/add.air /tmp/AAPLShaders.air \
            -o metallib-output/Shaders.metallib \
            --name MetalSamples
          
          echo "✓ metallib created successfully (no libmetal_rt_ios.a included - Xcode will link Metal.framework)"
          ls -lh metallib-output/

      - name: Upload metallib as a dedicated artifact for the macOS stage
        uses: actions/upload-artifact@v4
        with:
          name: metallib-output-arm64
          path: metallib-output/
          if-no-files-found: error
          retention-days: 7

      - name: Upload compiler, metallib, and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-linux-arm64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build/bin/clang
            build/bin/metal-as
            build/bin/metal-ld
            build.log
            test-results/
            metal-observed-manifest.json
            metallib-output/
          if-no-files-found: warn
          retention-days: 7

  # Stage 2: Build iOS app on macOS
  build-ios-app:
    name: Build iOS App (macOS)
    needs: build-metallib
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Select Xcode ${{ inputs.xcode_version }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ inputs.xcode_version }}

      - name: Verify Xcode and Metal toolchain
        run: |
          set -euxo pipefail
          xcodebuild -version
          xcrun --find metal
          xcrun metal --version
          echo "✓ Xcode ${{ inputs.xcode_version }} with Metal toolchain verified"

      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Download metallib artifact (built on ubuntu-24.04-arm)
        uses: actions/download-artifact@v4
        with:
          name: metallib-output-arm64
          path: metallib-input

      - name: Verify metallib
        run: |
          echo "Verifying metallib files..."
          ls -lh metallib-input/
          file metallib-input/Shaders.metallib || true
          echo "✓ metallib downloaded (Xcode will link Metal.framework automatically, which includes libmetal_rt_ios.a)"

      - name: Create iOS app with metallib
        run: |
          set -euxo pipefail
          
          # Create Xcode project structure
          mkdir -p MetalTestApp
          cd MetalTestApp
          
          # Copy metallib only (no libmetal_rt_ios.a needed - Xcode links Metal.framework automatically)
          cp ../metallib-input/Shaders.metallib .
          
          # Create basic iOS app structure
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>com.example.MetalTestApp</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>MetalTestApp</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>${{ inputs.ios_target }}</string>
          </dict>
          </plist>
          EOF
          
          # Create basic Swift app that uses metallib
          cat > AppDelegate.swift << 'EOF'
          import UIKit
          import Metal
          
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              window?.rootViewController = MetalViewController()
              window?.makeKeyAndVisible()
              return true
            }
          }
          EOF
          
          # Create Metal view controller
          cat > MetalViewController.swift << 'EOF'
          import UIKit
          import Metal
          import MetalKit
          
          class MetalViewController: UIViewController {
            var metalView: MTKView!
            var device: MTLDevice!
            var commandQueue: MTLCommandQueue!
            var pipelineState: MTLRenderPipelineState!
            
            override func viewDidLoad() {
              super.viewDidLoad()
              
              // Initialize Metal
              guard let device = MTLCreateSystemDefaultDevice() else {
                print("Metal is not supported on this device")
                return
              }
              self.device = device
              
              // Create MTKView
              metalView = MTKView(frame: view.bounds, device: device)
              metalView.delegate = self
              metalView.clearColor = MTLClearColor(red: 0.0, green: 0.0, blue: 0.0, alpha: 1.0)
              metalView.colorPixelFormat = .bgra8Unorm
              view.addSubview(metalView)
              
              // Create command queue
              commandQueue = device.makeCommandQueue()
              
              // Load metallib
              do {
                let library = try device.makeLibrary(filepath: Bundle.main.path(forResource: "Shaders", ofType: "metallib")!)
                print("Successfully loaded metallib with functions: \(library.functionNames)")
                
                // Create render pipeline
                let pipelineDescriptor = MTLRenderPipelineDescriptor()
                pipelineDescriptor.vertexFunction = library.makeFunction(name: "vertexShader")
                pipelineDescriptor.fragmentFunction = library.makeFunction(name: "fragmentShader")
                pipelineDescriptor.colorAttachments[0].pixelFormat = .bgra8Unorm
                
                pipelineState = try device.makeRenderPipelineState(descriptor: pipelineDescriptor)
                print("Successfully created render pipeline state")
              } catch {
                print("Failed to load metallib or create pipeline: \(error)")
              }
            }
          }
          
          extension MetalViewController: MTKViewDelegate {
            func mtkView(_ view: MTKView, drawableSizeWillChange size: CGSize) {}
            
            func draw(in view: MTKView) {
              guard let drawable = view.currentDrawable,
                    let renderPassDescriptor = view.currentRenderPassDescriptor,
                    let pipelineState = pipelineState else {
                return
              }
              
              let commandBuffer = commandQueue.makeCommandBuffer()!
              let renderEncoder = commandBuffer.makeRenderCommandEncoder(descriptor: renderPassDescriptor)!
              
              renderEncoder.setRenderPipelineState(pipelineState)
              // Draw a triangle
              renderEncoder.drawPrimitives(type: .triangle, vertexStart: 0, vertexCount: 3)
              renderEncoder.endEncoding()
              
              commandBuffer.present(drawable)
              commandBuffer.commit()
            }
          }
          EOF
          
          echo "✓ iOS app structure created"

      - name: Build iOS app for device (unsigned)
        run: |
          set -euxo pipefail
          cd MetalTestApp
          
          # Create Xcode project
          mkdir -p MetalTestApp.xcodeproj
          cat > MetalTestApp.xcodeproj/project.pbxproj << 'EOF'
          // Minimal Xcode project file for iOS device build
          // Note: This is a simplified version - actual Xcode project would be more complex
          // The actual project would link Metal.framework automatically
          EOF
          
          # Build for iOS device (unsigned, Ad Hoc compatible)
          # Note: No code signing required for build, but device installation requires signing
          xcodebuild -project MetalTestApp.xcodeproj \
            -scheme MetalTestApp \
            -sdk iphoneos \
            -configuration Release \
            -arch arm64 \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            | tee xcodebuild.log || echo "Build completed with warnings"
          
          echo "✓ iOS app built for device (unsigned, Ad Hoc compatible)"

      - name: Create IPA from app bundle
        run: |
          set -euxo pipefail
          cd MetalTestApp
          
          # Find the .app bundle
          APP_PATH=$(find . -name "*.app" -type d | head -1)
          if [ -z "$APP_PATH" ]; then
            echo "ERROR: No .app bundle found"
            exit 1
          fi
          
          echo "Found app bundle: $APP_PATH"
          
          # Create Payload directory
          mkdir -p Payload
          
          # Copy .app to Payload
          cp -R "$APP_PATH" Payload/
          
          # Create IPA (just a zip with .ipa extension)
          APP_NAME=$(basename "$APP_PATH" .app)
          zip -r "${APP_NAME}.ipa" Payload/
          
          echo "✓ Created ${APP_NAME}.ipa (unsigned, requires Ad Hoc signing for device installation)"
          ls -lh *.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-ipa
          path: MetalTestApp/*.ipa
          retention-days: 1

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            MetalTestApp/xcodebuild.log
          if-no-files-found: ignore
