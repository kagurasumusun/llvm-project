name: Metal Two-Stage Build

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and build"
        required: true
        default: "metal-test"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      ios_target:
        description: "iOS target version"
        required: true
        default: "26.2"
        type: string

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "4G"
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

jobs:
  # Stage 1: Build metallib on Linux
  build-metallib:
    name: Build metallib (Linux)
    runs-on: ubuntu-22.04
    timeout-minutes: 150

    steps:
      - name: Checkout selected ref sparse
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            clang
            llvm
            cmake
            third-party

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 ccache lld
          if ! command -v clang >/dev/null 2>&1 || ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get install -y clang
          fi

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt') }}-
            ${{ runner.os }}-metal-metallib-${{ inputs.build_type }}-${{ inputs.ref }}-
            ${{ runner.os }}-metal-metallib-${{ inputs.build_type }}-

      - name: Fetch Apple Metal stdlib/runtime from metal-info
        run: |
          set -euxo pipefail
          python3 clang/utils/metal/fetch-metal-info-resource.py \
            --output "$PWD/metal-info-resource" \
            --include-runtime
          test -f "$PWD/metal-info-resource/clang/32023.883/include/metal/metal_stdlib"
          test -f "$PWD/metal-info-resource/clang/32023.883/lib/darwin/libmetal_rt_osx.a"

      - name: Configure and build clang with Metal support
        run: |
          set -euxo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE" || true
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O2 -DNDEBUG" \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_BUILD_TOOLS=ON \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF
          
          JOBS="${{ inputs.ninja_jobs }}"
          if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          echo "Using ninja jobs: $JOBS"
          ninja -C build -j"$JOBS" clang metal-as metal-ld 2>&1 | tee build.log

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: Compile Apple Metal samples to metallib
        run: |
          set -euxo pipefail
          CLANG="$PWD/build/bin/clang"
          METAL_AS="$PWD/build/bin/metal-as"
          METAL_LD="$PWD/build/bin/metal-ld"
          APPLE_METAL_RESOURCE="$PWD/metal-info-resource/clang/32023.883"
          APPLE_METAL_INCLUDE="$APPLE_METAL_RESOURCE/include/metal"
          APPLE_METAL_RUNTIME="$APPLE_METAL_RESOURCE/lib/darwin"
          
          mkdir -p metallib-output
          
          # Compile add.metal (compute shader)
          echo "Compiling add.metal..."
          "$CLANG" -cc1 -triple air64-apple-ios${{ inputs.ios_target }} -x metal -std=metal3.0 \
            -I "$APPLE_METAL_INCLUDE" \
            -emit-llvm-bc -o /tmp/add.bc \
            clang/test/AppleMetalSamples/PerformingCalculationsOnAGPU/add.metal
          
          "$METAL_AS" /tmp/add.bc -o /tmp/add.air --triple air64-apple-ios${{ inputs.ios_target }}
          
          # Compile AAPLShaders.metal (render pipeline)
          echo "Compiling AAPLShaders.metal..."
          "$CLANG" -cc1 -triple air64-apple-ios${{ inputs.ios_target }} -x metal -std=metal3.0 \
            -I "$APPLE_METAL_INCLUDE" \
            -I clang/test/AppleMetalSamples/UsingARenderPipelineToRenderPrimitives \
            -emit-llvm-bc -o /tmp/AAPLShaders.bc \
            clang/test/AppleMetalSamples/UsingARenderPipelineToRenderPrimitives/AAPLShaders.metal
          
          "$METAL_AS" /tmp/AAPLShaders.bc -o /tmp/AAPLShaders.air --triple air64-apple-ios${{ inputs.ios_target }}
          
          # Link into metallib
          echo "Linking metallib..."
          "$METAL_LD" /tmp/add.air /tmp/AAPLShaders.air \
            -o metallib-output/Shaders.metallib \
            --name MetalSamples
          
          # Copy runtime library
          cp "$APPLE_METAL_RUNTIME/libmetal_rt_ios.a" metallib-output/
          
          echo "✓ metallib created successfully"
          ls -lh metallib-output/

      - name: Upload metallib artifact
        uses: actions/upload-artifact@v4
        with:
          name: metallib-output
          path: metallib-output/
          retention-days: 1

  # Stage 2: Build iOS app on macOS
  build-ios-app:
    name: Build iOS App (macOS)
    needs: build-metallib
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1

      - name: Download metallib artifact
        uses: actions/download-artifact@v4
        with:
          name: metallib-output
          path: metallib-input

      - name: Verify metallib
        run: |
          echo "Verifying metallib files..."
          ls -lh metallib-input/
          file metallib-input/Shaders.metallib || true
          file metallib-input/libmetal_rt_ios.a || true

      - name: Create iOS app with metallib
        run: |
          set -euxo pipefail
          
          # Create Xcode project structure
          mkdir -p MetalTestApp
          cd MetalTestApp
          
          # Copy metallib and runtime
          cp ../metallib-input/Shaders.metallib .
          cp ../metallib-input/libmetal_rt_ios.a .
          
          # Create basic iOS app structure
          cat > Info.plist << 'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleDevelopmentRegion</key>
            <string>en</string>
            <key>CFBundleExecutable</key>
            <string>$(EXECUTABLE_NAME)</string>
            <key>CFBundleIdentifier</key>
            <string>$(PRODUCT_BUNDLE_IDENTIFIER)</string>
            <key>CFBundleInfoDictionaryVersion</key>
            <string>6.0</string>
            <key>CFBundleName</key>
            <string>$(PRODUCT_NAME)</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>CFBundleShortVersionString</key>
            <string>1.0</string>
            <key>CFBundleVersion</key>
            <string>1</string>
            <key>LSRequiresIPhoneOS</key>
            <true/>
            <key>UILaunchStoryboardName</key>
            <string>LaunchScreen</string>
            <key>UIRequiredDeviceCapabilities</key>
            <array>
              <string>armv7</string>
            </array>
            <key>UISupportedInterfaceOrientations</key>
            <array>
              <string>UIInterfaceOrientationPortrait</string>
            </array>
            <key>MinimumOSVersion</key>
            <string>${{ inputs.ios_target }}</string>
          </dict>
          </plist>
          EOF
          
          # Create basic Swift app that uses metallib
          cat > AppDelegate.swift << 'EOF'
          import UIKit
          import Metal
          
          @main
          class AppDelegate: UIResponder, UIApplicationDelegate {
            var window: UIWindow?
            
            func application(_ application: UIApplication, didFinishLaunchingWithOptions launchOptions: [UIApplication.LaunchOptionsKey: Any]?) -> Bool {
              window = UIWindow(frame: UIScreen.main.bounds)
              window?.rootViewController = UIViewController()
              window?.makeKeyAndVisible()
              
              // Load metallib
              guard let device = MTLCreateSystemDefaultDevice() else {
                print("Metal is not supported on this device")
                return true
              }
              
              do {
                let library = try device.makeLibrary(filepath: Bundle.main.path(forResource: "Shaders", ofType: "metallib")!)
                print("Successfully loaded metallib with functions: \(library.functionNames)")
              } catch {
                print("Failed to load metallib: \(error)")
              }
              
              return true
            }
          }
          EOF
          
          echo "✓ iOS app structure created"

      - name: Build iOS app with Xcode
        run: |
          set -euxo pipefail
          cd MetalTestApp
          
          # Build for iOS simulator (actual device requires code signing)
          xcodebuild -scheme MetalTestApp \
            -destination 'platform=iOS Simulator,name=iPhone 15' \
            -configuration Release \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            | tee xcodebuild.log || echo "Build completed with warnings"
          
          echo "✓ iOS app built successfully"

      - name: Upload build logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-app-build-logs
          path: |
            MetalTestApp/xcodebuild.log
          if-no-files-found: ignore
