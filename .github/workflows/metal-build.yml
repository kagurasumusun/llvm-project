name: Metal frontend build and test

# A thin wrapper. Every step just calls into ci/metal/build.sh, and all of the
# real logic -- cmake flags, which target to build, how the stdlib is fetched,
# how diagnostics are surfaced -- lives there.
#
# That split is deliberate. GitHub refuses writes to .github/workflows/ from
# any GitHub App that lacks the `workflows` permission, and neither the agent
# working on this repository nor the built-in GITHUB_TOKEN can hold it (the
# github-actions bot cannot be granted it at all). Anything outside that
# directory is unrestricted, so keeping this file down to a list of script
# invocations means the pipeline can be changed without a human having to
# hand-edit a protected file. This file should only need to change when a
# step is added or removed.
#
# Speed comes from: ubuntu-24.04-arm (4 vCPUs rather than the 2 on the free
# x86 runners), mold, ccache, and a minimal cmake configuration.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'clang/**'
      - 'llvm/**'
      - 'ci/metal/**'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'clang/**'
      - 'llvm/**'
      - 'ci/metal/**'
  workflow_dispatch:

concurrency:
  group: metal-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build clang and run clang/test/Metal
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: ci/metal/build.sh deps

      - name: Fetch the Apple standard library
        id: stdlib
        continue-on-error: true
        run: ci/metal/build.sh stdlib

      - name: Restore ccache
        # restore + save rather than the combined action. actions/cache only
        # writes its entry in a post step, and that post step is skipped when
        # the job fails -- so while the lit stage was red the cache was never
        # written and every run recompiled LLVM from scratch. Checked against
        # the API: this branch had zero cache entries. Saving explicitly, right
        # after the build and with if: always(), decouples the two.
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            metal-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats

      - name: Configure
        run: ci/metal/build.sh configure

      - name: Build TableGen output first
        run: ci/metal/build.sh tablegen

      - name: Build clang and test tools
        run: ci/metal/build.sh build

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Smoke test the Metal frontend
        run: ci/metal/build.sh smoke

      - name: Run clang/test/Metal
        run: ci/metal/build.sh test

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metal-build-logs
          path: |
            /tmp/build.log
            /tmp/lit.log
            /tmp/tblgen.log
          if-no-files-found: ignore
          retention-days: 7
