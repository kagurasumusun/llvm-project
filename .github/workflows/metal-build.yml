name: Metal frontend build and test

# Builds just enough of Clang to compile and run the Metal Shading Language
# frontend tests in clang/test/Metal.
#
# Speed comes from four things:
#   * ubuntu-24.04-arm, which gives 4 vCPUs instead of the 2 on the free x86
#     runners, and ships a new enough toolchain that no PPA is needed.
#   * mold as the linker. Linking clang is the single slowest step of the
#     build and mold cuts it to a few seconds.
#   * ccache, restored from the Actions cache, so that reruns only recompile
#     what actually changed.
#   * a minimal configuration: one target (X86, which is only there because
#     LLVM_TARGETS_TO_BUILD may not be empty), no assertions, no examples, no
#     benchmarks, no static analyzer, shared libraries so that the link step
#     stays small, and no debug info.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'clang/**'
      - 'llvm/**'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'clang/**'
      - 'llvm/**'
  workflow_dispatch:

concurrency:
  group: metal-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build clang and run clang/test/Metal
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build mold ccache cmake python3
          echo "nproc=$(nproc)"
          mold --version
          ccache --version | head -1

      - name: Restore ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          # The key rotates per run so that every build writes a fresh entry;
          # restore-keys then falls back to the newest previous one.
          key: metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            metal-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=X86 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_USE_LINKER=mold \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_INCLUDE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-g0" \
            -DCMAKE_CXX_FLAGS="-g0"

      - name: Build TableGen output first
        # The Metal work touches Attr.td, Builtins.def and the diagnostics, so
        # failures there should surface before the long compile starts.
        run: ninja -C build -j$(nproc) clang-tablegen-targets

      - name: Build clang and test tools
        run: ninja -C build -j$(nproc) clang FileCheck count not llvm-config

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Smoke test the Metal frontend
        run: |
          cat > /tmp/smoke.metal <<'EOF'
          kernel void k(device float *out [[buffer(0)]],
                        unsigned int id [[thread_position_in_grid]]) {
            out[id] = 1.0f;
          }
          EOF
          ./build/bin/clang -cc1 -x metal \
            -triple air64_v28-apple-macosx26.0.0 -std=metal3.2 \
            -emit-llvm -no-opaque-pointers -o - /tmp/smoke.metal

      - name: Run clang/test/Metal
        run: ./build/bin/llvm-lit -v --timeout=120 clang/test/Metal

      - name: Upload configure logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metal-build-logs
          path: |
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
