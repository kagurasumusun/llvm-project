name: Sync workflows from ci/workflows

# Copies ci/workflows/*.yml into .github/workflows/ and commits the result.
#
# Arena GitHub App cannot update .github/workflows without the Workflows
# repository permission. This workflow intentionally lets Arena edit only
# ci/workflows and uses a separate token for the final push.

on:
  push:
    paths:
      - 'ci/workflows/**'
  workflow_dispatch:

concurrency:
  group: sync-workflows-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  sync:
    name: mirror ci/workflows into .github/workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          # Do not keep Arena App credentials.
          persist-credentials: false

      - name: Copy and commit
        run: |
          set -uo pipefail

          if [ ! -d ci/workflows ]; then
            echo "ci/workflows does not exist; nothing to do"
            exit 0
          fi

          mkdir -p .github/workflows

          changed=0

          while IFS= read -r src; do
            name=$(basename "$src")

            # Prevent this workflow from rewriting itself.
            if [ "$name" = "sync-workflows.yml" ]; then
              echo "skip  $name (this job does not update itself)"
              continue
            fi

            dst=".github/workflows/$name"

            if [ -f "$dst" ] && cmp -s "$src" "$dst"; then
              echo "same  $name"
              continue
            fi

            cp "$src" "$dst"
            echo "sync  $name"
            changed=1

          done < <(
            find ci/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) |
            sort
          )

          if [ "$changed" -eq 0 ]; then
            echo "already in sync"
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add .github/workflows

          if git diff --cached --quiet; then
            echo "nothing staged after copy"
            exit 0
          fi

          git commit \
            -m "[CI] ci/workflows から .github/workflows へ同期 ($GITHUB_SHA)"

      - name: Push with PAT
        env:
          GH_TOKEN: ${{ secrets.METAL_INFO_TOKEN }}
        run: |
          set -euo pipefail

          if [ -z "$GH_TOKEN" ]; then
            echo "METAL_INFO_TOKEN is not set"
            exit 1
          fi

          git remote set-url origin \
            "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}"

          git push
