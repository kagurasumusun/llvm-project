name: Metal Clang Smoke Build

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and build"
        required: true
        default: "metal-test"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      ninja_jobs:
        description: "Parallel ninja jobs"
        required: true
        default: "2"

permissions:
  contents: read

jobs:
  clang-metal-smoke:
    name: clang-only build + Metal smoke tests
    runs-on: ubuntu-22.04
    timeout-minutes: 240

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3
          cmake --version
          ninja --version
          python3 --version

      - name: Configure clang-only LLVM build
        run: |
          set -euxo pipefail
          cmake -S llvm -B build -G Ninja \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD="X86;AArch64" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DLLVM_ENABLE_ASSERTIONS=ON \
            -DLLVM_INCLUDE_TESTS=ON \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF

      - name: Build clang and FileCheck
        run: |
          set -o pipefail
          ninja -C build -j"${{ inputs.ninja_jobs }}" clang FileCheck 2>&1 | tee build.log

      - name: Run focused Metal smoke tests
        run: |
          exec > >(tee metal-smoke.log) 2>&1
          set -euxo pipefail
          CLANG="$PWD/build/bin/clang"
          FILECHECK="$PWD/build/bin/FileCheck"

          run_syntax() {
            local triple="$1"; shift
            local std="$1"; shift
            local file="$1"; shift
            "$CLANG" -cc1 -triple "$triple" -x metal -std="$std" -fsyntax-only "$file"
          }

          run_verify() {
            local triple="$1"; shift
            local std="$1"; shift
            local file="$1"; shift
            "$CLANG" -cc1 -triple "$triple" -x metal -std="$std" -fsyntax-only -verify "$file"
          }

          run_codegen() {
            local triple="$1"; shift
            local std="$1"; shift
            local file="$1"; shift
            "$CLANG" -cc1 -triple "$triple" -x metal -std="$std" -emit-llvm -o - "$file" | "$FILECHECK" "$file"
          }

          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Frontend/metal-input-kind.c
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-basic-keywords.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-prelude-types.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-generated-prelude-table.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-ast-reference-builtins.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-builtin-object-aliases.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-ast-reference-attrs.metal
          run_syntax air64-apple-macosx26.0 metal4.0 clang/test/Parser/metal-generated-prelude-table.metal

          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-color-validation.metal
          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-builtin-input-validation.metal
          run_verify air64-apple-macosx26.0 metal4.0 clang/test/Sema/metal-resource-validation.metal
          run_verify air64-apple-macosx10.14 metal1.1 clang/test/Sema/metal-availability.metal

          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-metadata.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-stage-metadata.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-io-metadata.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-stage-in-struct.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-builtin-inputs.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-buffer-reference.metal
          run_codegen air64_v22-apple-macosx10.15 metal2.0 clang/test/CodeGen/metal-air-function-constants.metal
          run_codegen air64_v22-apple-macosx10.15 metal4.0 clang/test/CodeGen/metal-air-generated-type-table.metal

      - name: Collect failure hints
        if: always()
        run: |
          {
            echo "# Metal Clang Smoke Build"
            echo
            echo "- Ref: `${{ inputs.ref }}`"
            echo "- Build type: `${{ inputs.build_type }}`"
            echo "- Ninja jobs: `${{ inputs.ninja_jobs }}`"
            echo
            echo "## Error / warning highlights"
            echo '```'
            grep -HnE "error:|warning:|FAILED|ninja: build stopped|undefined reference|No such file|Assertion" build.log metal-smoke.log 2>/dev/null | tail -n 200 || true
            echo '```'
          } | tee failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-clang-smoke-logs
          path: |
            build.log
            metal-smoke.log
            failure-summary.md
          if-no-files-found: ignore
