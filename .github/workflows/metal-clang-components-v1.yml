name: Metal Clang Components Fast

"on":
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to checkout and compile-check"
        required: true
        default: "metal-test"
      build_type:
        description: "CMake build type"
        required: true
        default: "Release"
        type: choice
        options:
          - Release
          - RelWithDebInfo
          - Debug
      ninja_jobs:
        description: "Parallel ninja jobs; 0 means nproc"
        required: true
        default: "0"
      component_targets:
        description: "Space-separated CMake/Ninja targets to compile"
        required: true
        default: "clangBasic clangLex clangAST clangSerialization clangParse clangSema clangCodeGen clangFrontend clangDriver"

permissions:
  contents: read

env:
  CCACHE_DIR: ${{ github.workspace }}/.ccache
  CCACHE_BASEDIR: ${{ github.workspace }}
  CCACHE_COMPRESS: "true"
  CCACHE_COMPRESSLEVEL: "6"
  CCACHE_MAXSIZE: "4G"
  CCACHE_NOHASHDIR: "true"
  CCACHE_SLOPPINESS: "pch_defines,time_macros,include_file_mtime,include_file_ctime"

concurrency:
  group: metal-clang-components-fast-${{ inputs.ref }}-${{ inputs.build_type }}
  cancel-in-progress: false

jobs:
  clang-components-fast:
    name: fast clang component compile check
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Checkout selected ref sparse
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout-cone-mode: true
          sparse-checkout: |
            clang
            llvm
            cmake
            third-party

      - name: Install fast build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build python3 ccache lld
          if ! command -v clang >/dev/null 2>&1 || ! command -v clang++ >/dev/null 2>&1; then
            sudo apt-get install -y clang
          fi
          cmake --version
          ninja --version
          ccache --version
          clang --version
          clang++ --version
          ld.lld --version

      - name: Restore ccache
        id: restore-ccache
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          key: ${{ runner.os }}-metal-components-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'clang/include/clang/Basic/Attr.td', 'clang/include/clang/Basic/Metal*.def', 'clang/lib/Sema/SemaDeclAttr.cpp', 'clang/lib/CodeGen/CodeGenFunction.cpp', 'clang/lib/Frontend/InitPreprocessor.cpp') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            ${{ runner.os }}-metal-components-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-${{ hashFiles('llvm/CMakeLists.txt', 'clang/CMakeLists.txt', 'clang/include/clang/Basic/Attr.td', 'clang/include/clang/Basic/Metal*.def', 'clang/lib/Sema/SemaDeclAttr.cpp', 'clang/lib/CodeGen/CodeGenFunction.cpp', 'clang/lib/Frontend/InitPreprocessor.cpp') }}-
            ${{ runner.os }}-metal-components-ccache-${{ inputs.build_type }}-${{ inputs.ref }}-
            ${{ runner.os }}-metal-components-ccache-${{ inputs.build_type }}-
            ${{ runner.os }}-metal-components-ccache-
            ${{ runner.os }}-metal-fast-ccache-
            ${{ runner.os }}-metal-clang-ccache-

      - name: Configure minimal clang component build
        run: |
          set -euxo pipefail
          ccache --set-config=max_size="$CCACHE_MAXSIZE" || true
          cmake -S llvm -B build -G Ninja \
            -DCMAKE_C_COMPILER=clang \
            -DCMAKE_CXX_COMPILER=clang++ \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DCMAKE_CXX_FLAGS_RELEASE="-O1 -DNDEBUG" \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD="X86" \
            -DCMAKE_BUILD_TYPE="${{ inputs.build_type }}" \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=1 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_INCLUDE_TESTS=OFF \
            -DCLANG_INCLUDE_TESTS=OFF \
            -DLLVM_BUILD_TESTS=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_BUILD_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_BUILD_EXAMPLES=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DCLANG_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_BUILD_TOOLS=OFF \
            -DCLANG_BUILD_TOOLS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF

      - name: Show clang component targets
        run: |
          ninja -C build -t targets | grep -E '^(clangBasic|clangLex|clangAST|clangSerialization|clangParse|clangSema|clangCodeGen|clangFrontend|clangDriver):' | sort || true

      - name: Build selected clang components
        run: |
          set -o pipefail
          ccache --zero-stats || true
          JOBS="${{ inputs.ninja_jobs }}"
          if [ "$JOBS" = "0" ] || [ -z "$JOBS" ]; then JOBS="$(nproc)"; fi
          TARGETS="${{ inputs.component_targets }}"
          echo "Using ninja jobs: $JOBS"
          echo "Building targets: $TARGETS"
          ninja -C build -j"$JOBS" $TARGETS 2>&1 | tee component-build.log

      - name: Save ccache immediately after component build
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ${{ steps.restore-ccache.outputs.cache-primary-key }}

      - name: CCache stats
        if: always()
        run: |
          ccache --show-stats || true

      - name: Collect failure hints
        if: always()
        run: |
          {
            echo "# Metal Clang Components Fast"
            echo
            echo "- Ref: ${{ inputs.ref }}"
            echo "- Build type: ${{ inputs.build_type }}"
            echo "- Ninja jobs: ${{ inputs.ninja_jobs }}"
            echo "- Component targets: ${{ inputs.component_targets }}"
            echo
            echo "## Error / warning highlights"
            echo '```'
            grep -HnE "error:|warning:|FAILED|ninja: build stopped|undefined reference|No such file|Assertion|CMake Error" component-build.log 2>/dev/null | tail -n 250 || true
            echo '```'
            echo
            echo "## ccache stats"
            echo '```'
            ccache --show-stats 2>/dev/null || true
            echo '```'
          } | tee component-failure-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-clang-components-fast-logs
          path: |
            component-build.log
            component-failure-summary.md
          if-no-files-found: ignore
