name: Metal frontend build and test

# Builds just enough of Clang to compile and run the Metal Shading Language
# frontend tests in clang/test/Metal.
#
# Speed comes from four things:
#   * ubuntu-24.04-arm, which gives 4 vCPUs instead of the 2 on the free x86
#     runners, and ships a new enough toolchain that no PPA is needed.
#   * mold as the linker. Linking clang is the single slowest step of the
#     build and mold cuts it to a few seconds.
#   * ccache, restored from the Actions cache, so that reruns only recompile
#     what actually changed.
#   * a minimal configuration: one target, no assertions, no examples, no
#     benchmarks, no static analyzer, shared libraries so that the link step
#     stays small, and no debug info.
#
# The target has to be AArch64 rather than X86: LLVM_DEFAULT_TARGET_TRIPLE is
# only derived when the *native* backend is among LLVM_TARGETS_TO_BUILD, and
# with an empty triple lit aborts with "Could not turn '' into Itanium ABI
# triple" before running a single test. Nothing in clang/test/Metal depends on
# which backend is built.

on:
  push:
    branches:
      - 'arena/**'
    paths:
      - 'clang/**'
      - 'llvm/**'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'clang/**'
      - 'llvm/**'
  workflow_dispatch:

concurrency:
  group: metal-build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: build clang and run clang/test/Metal
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            ninja-build mold ccache cmake python3
          echo "nproc=$(nproc)"
          mold --version
          ccache --version | head -1

      - name: Restore the Apple standard library
        # clang/test/Metal does not include <metal_stdlib>, but having the real
        # headers on the runner lets the smoke test below compile against them
        # and makes it possible to add tests that do. Only the header tree is
        # fetched: metal-info is ~12 GB in full, so a blobless sparse checkout
        # of reference-apple keeps this to a few tens of megabytes.
        id: stdlib
        continue-on-error: true
        run: |
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/kagurasumusun/metal-info.git /tmp/metal-info
          cd /tmp/metal-info
          git sparse-checkout init --cone
          git sparse-checkout set reference-apple
          git checkout
          # The headers sit under reference-apple/clang/<version>/include/metal.
          SDK=$(find /tmp/metal-info/reference-apple -type d -name metal \
                  -path '*/include/metal' | head -1)
          echo "metal_stdlib=${SDK}" >> "$GITHUB_OUTPUT"
          echo "found ${SDK}"
          ls "${SDK}" | head -20
          find "${SDK}" -type f | wc -l

      - name: Restore ccache
        # restore + save rather than the combined action. actions/cache only
        # writes its entry in a post step, and that post step is skipped when
        # the job fails -- so while the lit stage was red the cache was never
        # populated and every run recompiled LLVM from scratch. Saving
        # explicitly right after the build decouples the two.
        id: ccache-restore
        uses: actions/cache/restore@v4
        with:
          path: ~/.ccache
          key: metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}
          restore-keys: |
            metal-ccache-${{ runner.os }}-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats

      - name: Configure
        run: |
          cmake -G Ninja -S llvm -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DLLVM_ENABLE_PROJECTS=clang \
            -DLLVM_TARGETS_TO_BUILD=AArch64 \
            -DLLVM_DEFAULT_TARGET_TRIPLE=aarch64-unknown-linux-gnu \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_OPTIMIZED_TABLEGEN=ON \
            -DLLVM_USE_LINKER=mold \
            -DLLVM_BUILD_LLVM_DYLIB=ON \
            -DLLVM_LINK_LLVM_DYLIB=ON \
            -DCLANG_LINK_CLANG_DYLIB=ON \
            -DLLVM_INCLUDE_EXAMPLES=OFF \
            -DLLVM_INCLUDE_BENCHMARKS=OFF \
            -DLLVM_INCLUDE_DOCS=OFF \
            -DLLVM_ENABLE_BINDINGS=OFF \
            -DLLVM_ENABLE_OCAMLDOC=OFF \
            -DLLVM_ENABLE_ZLIB=OFF \
            -DLLVM_ENABLE_ZSTD=OFF \
            -DLLVM_ENABLE_TERMINFO=OFF \
            -DLLVM_ENABLE_LIBXML2=OFF \
            -DLLVM_ENABLE_LIBEDIT=OFF \
            -DCLANG_ENABLE_STATIC_ANALYZER=OFF \
            -DCLANG_ENABLE_ARCMT=OFF \
            -DLLVM_INCLUDE_TESTS=ON \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_C_FLAGS="-g0" \
            -DCMAKE_CXX_FLAGS="-g0"

      - name: Build TableGen output first
        # The Metal work touches Attr.td, Builtins.def and the diagnostics, so
        # failures there should surface before the long compile starts.
        run: ninja -C build -j$(nproc) clang-tablegen-targets

      - name: Build clang and test tools
        # Compiler diagnostics are echoed back as annotations for the same
        # reason as the lit stage below: the raw log is not always reachable.
        run: |
          set +e
          ninja -C build -j$(nproc) clang FileCheck count not llvm-config 2>&1 \
            | tee /tmp/build.log
          rc=${PIPESTATUS[0]}
          if [ "$rc" -ne 0 ]; then
            echo "::group::first errors"
            grep -nE 'error:|FAILED:' /tmp/build.log | head -40
            echo "::endgroup::"
            grep -E 'error:' /tmp/build.log | head -15 | while read -r l; do
              echo "::error::${l:0:400}"
            done
          fi
          exit "$rc"

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      - name: Save ccache
        # Runs even when a later step fails, and even when the build itself
        # fails: a partial cache still saves most of the next run.
        if: always()
        uses: actions/cache/save@v4
        with:
          path: ~/.ccache
          key: metal-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.sha }}

      - name: Smoke test the Metal frontend
        run: |
          cat > /tmp/smoke.metal <<'EOF'
          kernel void k(device float *out [[buffer(0)]],
                        unsigned int id [[thread_position_in_grid]]) {
            out[id] = 1.0f;
          }
          EOF
          ./build/bin/clang -cc1 -x metal \
            -triple air64_v28-apple-macosx26.0.0 -std=metal3.2 \
            -emit-llvm -no-opaque-pointers -o - /tmp/smoke.metal

          # Report how far the real <metal_stdlib> gets. This is expected to
          # fail for now and is informational only, which is why it does not
          # gate the job: the header tree is the yardstick for how complete the
          # frontend is.
          SDK='${{ steps.stdlib.outputs.metal_stdlib }}'
          if [ -n "$SDK" ] && [ -d "$SDK" ]; then
            echo "::group::<metal_stdlib> parse attempt"
            printf '#include <metal_stdlib>\nkernel void k() {}\n' > /tmp/std.metal
            ./build/bin/clang -cc1 -x metal \
              -triple air64_v28-apple-macosx26.0.0 -std=metal3.2 \
              -I "$(dirname "$SDK")" -fsyntax-only /tmp/std.metal 2>&1 | head -40 || true
            echo "::endgroup::"
          fi

      - name: Run clang/test/Metal
        # The raw log is served from Azure Blob storage, which is not always
        # reachable from where these logs get read back, so the failing test
        # names and their diagnostics are re-emitted as workflow annotations.
        run: |
          set +e
          ./build/bin/llvm-lit -v --timeout=120 clang/test/Metal 2>&1 | tee /tmp/lit.log
          rc=${PIPESTATUS[0]}
          echo "::group::lit summary"
          sed -n '/Failed Tests/,$p' /tmp/lit.log
          echo "::endgroup::"
          if [ "$rc" -ne 0 ]; then
            grep -E '^(FAIL|UNRESOLVED|TIMEOUT):' /tmp/lit.log | while read -r l; do
              echo "::error::${l}"
            done
            grep -E 'error:' /tmp/lit.log | head -25 | while read -r l; do
              echo "::error::${l:0:400}"
            done
          fi
          exit "$rc"

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: metal-build-logs
          path: |
            /tmp/lit.log
            build/CMakeCache.txt
            build/CMakeFiles/CMakeConfigureLog.yaml
          if-no-files-found: ignore
          retention-days: 7
