name: Metal frontend build and test

# A thin wrapper: every step calls into ci/metal/build.sh, and all of the real
# logic lives there. That split exists because .github/workflows/ is
# write-protected for GitHub Apps, so keeping this file down to a list of
# invocations means the pipeline can change without editing a protected file.
#
# Ordering and failure handling are deliberate:
#   * the cache is pruned after a successful build, keeping room for saves;
#   * ccache is saved only on build success, so a broken build never
#     corrupts the content-addressed cache for other branches;
#   * the smoke test runs with if: always() too -- if the build fell over it
#     will simply fail, but when only lit is red it still proves the compiler
#     works end to end;
#   * logs are uploaded on failure, so a failed run is still evidence.

on:
  push:
    branches:
      - 'arena/**'
      - 'many-error'
    paths:
      - 'clang/**'
      - 'llvm/**'
      - 'ci/metal/**'
      - '.github/workflows/metal-build.yml'
  pull_request:
    paths:
      - 'clang/**'
      - 'llvm/**'
      - 'ci/metal/**'
  workflow_dispatch:
  # The sync job pushes .github/workflows/metal-build.yml, but a push made
  # with GITHUB_TOKEN does not start other workflows -- GitHub suppresses that
  # to avoid loops. workflow_run fires on the sync completing instead, so a
  # change to ci/workflows/ still gets built.
  workflow_run:
    workflows: ['Sync workflows from ci/workflows']
    types: [completed]
    branches: ['arena/**']

permissions:
  contents: read
  actions: write

jobs:
  build:
    name: build clang and run clang/test/Metal
    # 4 vCPUs against 2 on the free x86 runners, and the host arch matches
    # the target the build is configured for.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120

    env:
      # ccache 4 defaults to ~/.cache/ccache, not ~/.ccache. The cache steps
      # were saving and restoring the latter, which never existed -- hence
      # "Cache save failed" on every run and zero entries in the repository.
      # Pinning it makes the two agree.
      CCACHE_DIR: /home/runner/.ccache

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # Blobless and sparse: the tree is 1.5 GB checked out in full, and
          # the build only reads llvm/, clang/, cmake/ and .github/. Filtering
          # the blobs means git fetches file contents on demand rather than
          # all of history's, and the sparse cone keeps mlir, lldb, libcxx,
          # compiler-rt, flang and the rest -- 384 MB -- off the runner
          # entirely.
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: |
            llvm
            clang
            cmake
            ci
          sparse-checkout-cone-mode: true
          # On a workflow_run trigger the default checkout is the default
          # branch, not the branch that was synced, so name it explicitly.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}

      # Independent of the build, and the slowest non-build step, so it goes
      # first while nothing depends on it yet.
      - name: Install toolchain
        run: ci/metal/build.sh deps

      - name: Restore ccache
        # restore + save rather than the combined action: actions/cache only
        # writes in a post step, and that post step is skipped when the job
        # fails. While the test stage was red the cache was never written.
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.CCACHE_DIR }}
          # Content-addressed: hashFiles of the source tree means every
          # branch that builds the same code shares the same cache entry,
          # and every code change creates a fresh one automatically.
          key: metal-ccache-${{ runner.arch }}-${{ hashFiles('clang/**', 'llvm/**', 'cmake/**') }}
          restore-keys: |
            metal-ccache-${{ runner.arch }}-

      - name: Configure ccache
        run: |
          ccache --set-config=max_size=2G
          ccache --set-config=compression=true
          ccache --set-config=sloppiness=pch_defines,time_macros,include_file_mtime,include_file_ctime
          ccache --zero-stats

      # Fetched while the cache is warming; nothing before the smoke test
      # needs it.
      - name: Fetch the Apple standard library
        continue-on-error: true
        run: ci/metal/build.sh stdlib

      - name: Configure
        run: ci/metal/build.sh configure

      # One ninja invocation. TableGen output is ordered ahead of its consumers
      # by the dependency graph, so a separate pass just costs a second start.
      - name: Build
        id: build
        run: ci/metal/build.sh build

      - name: ccache statistics
        if: always()
        run: ccache --show-stats

      # Unconditional: a partial cache from a failed build still saves most of
      # the next run. The run id keeps re-runs of one commit from colliding.
      - name: Save ccache
        # Save when the clang+llvm build attempted (not skipped), even on
        # failure: a partial build cache still speeds up the next iteration.
        if: always() && steps.build.outcome != 'skipped'
        uses: actions/cache/save@v4
        continue-on-error: true
        with:
          path: ${{ env.CCACHE_DIR }}
          key: metal-ccache-${{ runner.arch }}-${{ hashFiles('clang/**', 'llvm/**', 'cmake/**') }}

      # Prune old cache entries only when this build succeeded.  A failing
      # build must never evict cache entries that a green build depends on.
      - name: Make room in the cache
        if: always() && steps.build.outcome == 'success'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: ci/metal/build.sh prune-cache

      - name: Smoke test the Metal frontend
        if: always() && steps.build.outcome == 'success'
        run: ci/metal/build.sh smoke

      - name: Run clang/test/Metal
        if: always() && steps.build.outcome == 'success'
        run: ci/metal/build.sh test

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: metal-logs-${{ github.run_id }}
          path: |
            /tmp/build.log
            /tmp/lit.log
          if-no-files-found: ignore
          retention-days: 7
