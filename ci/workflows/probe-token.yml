name: Probe whether GITHUB_TOKEN may write workflows

# Settles one question that cannot be answered from outside the runner: is the
# built-in GITHUB_TOKEN allowed to modify .github/workflows/?
#
# It matters because sync-workflows.yml is built on the assumption that it is.
# GITHUB_TOKEN authenticates as github-actions[bot], which is a GitHub App, and
# App installations are refused workflow writes unless they hold the
# `workflows` permission -- the same refusal the agent hits. If that applies
# here too, the whole sync approach is void and workflow changes have to keep
# going through a human.
#
# The probe appends a comment to metal-build.yml, pushes, and immediately
# reverts. Result is reported as an annotation, since the raw log is served
# from Azure Blob storage and is not always reachable.
#
# Delete this file once the answer is recorded.

on:
  workflow_dispatch:
  push:
    paths:
      - 'ci/workflows/probe-token.yml'

permissions:
  contents: write

jobs:
  probe:
    name: can GITHUB_TOKEN write .github/workflows
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Try to write a workflow file
        run: |
          set -uo pipefail
          git config user.name  'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          target=.github/workflows/metal-build.yml
          if [ ! -f "$target" ]; then
            echo "::error::${target} is missing; nothing to probe with"
            exit 1
          fi

          printf '# workflow-write probe %s\n' "${GITHUB_SHA}" >> "$target"
          git add "$target"
          git commit -q -m "probe: may GITHUB_TOKEN write .github/workflows"

          if git push 2>/tmp/push.err; then
            echo "::notice::RESULT: GITHUB_TOKEN CAN write .github/workflows"
            echo "The sync approach is viable."
            # Leave the branch exactly as it was.
            git revert --no-edit HEAD >/dev/null
            git push
          else
            echo "::error::RESULT: GITHUB_TOKEN CANNOT write .github/workflows"
            while read -r l; do echo "::error::${l}"; done < /tmp/push.err
            echo "The sync approach cannot work; workflow edits need a human"
            echo "or a PAT with the workflow scope stored as a secret."
            exit 1
          fi
